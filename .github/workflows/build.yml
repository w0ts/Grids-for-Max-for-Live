# Builds the grids external on macOS (x86_64 + arm64, signed ad hoc) and Windows (x64) with the Max SDK, then packs
# Grids.amxd from device/ and those two builds (tools/amxd.py). A v* tag attaches Grids.amxd to its release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    strategy:
      matrix:
        include:
          - os: macos-latest
            file: grids.mxo
          - os: windows-latest
            file: grids.mxe64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Check (macOS)
        if: runner.os == 'macOS'
        run: |
          lipo -archs build/package/externals/grids.mxo/Contents/MacOS/grids
          nm -gU build/package/externals/grids.mxo/Contents/MacOS/grids | grep _ext_main
          codesign -v build/package/externals/grids.mxo
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: build/package/externals/${{ matrix.file }}
          retention-days: 14

  device:
    needs: external
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: python3 -m unittest discover -s tests
      - uses: actions/download-artifact@v4
        with:
          path: ext
      - name: Pack Grids.amxd
        run: |
          python3 tools/amxd.py build --mxo ext/grids.mxo --mxe64 ext/grids.mxe64/grids.mxe64 --out Grids.amxd
          python3 tools/amxd.py list Grids.amxd
      - uses: actions/upload-artifact@v4
        with:
          name: Grids.amxd
          path: Grids.amxd
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Grids for Max for Live ${GITHUB_REF_NAME#v}" \
              --notes "Grids.amxd: the Max for Live device, built from this tag. Drop it into your Live set or your User Library. How to use it: https://w0ts.github.io/Grids-for-Max-for-Live/ What changed: https://github.com/w0ts/Grids-for-Max-for-Live/blob/main/CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" Grids.amxd --clobber --repo "$GITHUB_REPOSITORY"
